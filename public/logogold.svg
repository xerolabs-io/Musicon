<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="90" fill="url(#bg-gradient)"/>
  <circle cx="100" cy="100" r="75" stroke="rgba(200, 162, 97, 0.2)" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="100" cy="100" r="60" stroke="rgba(200, 162, 97, 0.25)" stroke-width="2"/>
  <circle cx="100" cy="100" r="45" stroke="rgba(200, 162, 97, 0.2)" stroke-width="2" stroke-dasharray="12 4"/>
  
  <!-- Center Label -->
  <circle cx="100" cy="100" r="32" fill="url(#center-gradient)"/>
  <circle cx="100" cy="100" r="8" fill="#090A0F"/>
  <circle cx="100" cy="100" r="3" fill="#DEC38B"/>

  <!-- Tonearm Stylus detail -->
  <path d="M 175 40 L 140 85 L 122 80" stroke="#C8A261" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="40" r="7" fill="#DEC38B"/>

  <defs>
